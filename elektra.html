<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technisch plan elektriciteit en sanitair — tuinstudio Ninove</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f4f1eb; padding: 16px; }
    .page { max-width: 1200px; margin: 0 auto; background: #faf8f4; }
    svg text { font-family: "Space Mono", monospace; }
    @media print { body { padding: 0; background: #fff; } }
  </style>
</head>
<body>
  <div class="page">
    <div id="studio-detail-plan"></div>
  </div>
  <script src="studio-plan.js"></script>
  <script>
    ["integrated-studio-deck", "fireplace-painting", "office-desk-zone", "pergola-furniture",
      "office-airco", "office-data", "office-socket-right", "office-socket-left", "fireplace-power",
      "lounge-socket", "pergola-socket", "bathroom-vanity-socket", "storage-utility-socket",
      "robot-socket", "pergola-heater-feed", "outdoor-hose-tap", "design-service-controls",
      "plan-dimensions", "xinix-door-setbacks", "plan-compass", "entrance-arrow"].forEach(id => {
      const el = document.getElementById(id);
      if (!el) throw new Error("missing " + id);
      el.remove();
    });
    const camera = document.querySelector('g[transform="translate(846,225)"]');
    if (!camera) throw new Error("missing camera");
    camera.remove();
    document.querySelectorAll("text").forEach(node => {
      const label = node.textContent.trim();
      if (/MOSO|40,36|POOLSOFA|EKET|hoekrug|zuidruimte|240 x 240|ETH|POE|grasrobot|afzuiging|toevoer|voeding|buitenkraan|zijde|breedte|m²/.test(label)
        || /^(E\d|S\d|F01|C\d|A01|V\d|W01|schuifraam|open \(|toegang |voorlopig$|\d)/.test(label)) node.remove();
    });
    console.assert(!document.getElementById("room-fresh-air") && !document.getElementById("office-data")
      && !document.querySelector('g[transform="translate(846,225)"]')
      && document.getElementById("bathroom-general-light") && document.getElementById("bathroom-shower"));
  </script>
</body>
</html>
