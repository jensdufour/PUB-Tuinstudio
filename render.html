<!DOCTYPE html>
<html lang="nl">

<head>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Render zwembadpad en tuinstudio</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    main,
    #scene {
      position: fixed;
      inset: 0;
    }

    #scene {
      z-index: 0;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .deck-area-badge {
      position: absolute;
      z-index: 2;
      top: 24px;
      left: 24px;
      padding: 10px 12px;
      border: 1px solid var(--cp-border);
      border-radius: 8px;
      background: var(--cp-panel-strong);
      color: var(--cp-text-muted);
      font-size: 12px;
      line-height: 1.2;
      box-shadow: 0 0 2px var(--cp-border);
      pointer-events: none;
    }

    .deck-area-value {
      color: var(--cp-accent);
      font-weight: 700;
      font-family: Consolas, "Courier New", Courier, monospace;
    }

    .control-dock {
      position: absolute;
      z-index: 3;
      right: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--cp-border);
      border-radius: 8px;
      background: var(--cp-panel-strong);
      box-shadow: 0 0 2px var(--cp-border);
      max-width: calc(100vw - 36px);
    }

    .tool-switch {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-left: 6px;
      border-left: 1px solid var(--cp-border);
    }

    .control-dock button {
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--cp-text);
      font: 600 12px/1 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
      box-shadow: none;
      white-space: nowrap;
    }

    .control-dock button:hover {
      border-color: var(--cp-border-strong);
      background: var(--cp-surface);
    }

    .control-dock button[aria-pressed="true"] {
      border-color: var(--cp-accent);
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
    }

    #loading {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--cp-bg);
      color: var(--cp-text-muted);
      font-size: 13px;
      transition: opacity 220ms ease;
    }

    #loading.ready {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .deck-area-badge {
        top: 18px;
        left: 18px;
        font-size: 11px;
      }

      .control-dock {
        left: 18px;
        right: 18px;
        bottom: 18px;
        align-items: center;
      }

      .control-dock button {
        min-height: 32px;
        padding-inline: 6px;
        font-size: 11px;
      }

      .tool-switch {
        padding-left: 5px;
        border-left: 1px solid var(--cp-border);
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>

<body>
  <main aria-label="3D visualisatie van tuinplan Lot 24B">
    <div id="scene"></div>

    <div class="deck-area-badge" aria-label="Nieuwe verharding">
      Nieuwe verharding: <span id="deck-area-value" class="deck-area-value">--,-- m²</span>
      <br>
      Oude verharding: <span id="old-area-value" class="deck-area-value">--,-- m²</span>
      <br>
      Totaal verharding: <span id="total-area-value" class="deck-area-value">--,-- m²</span>
    </div>

    <div class="control-dock" aria-label="Renderinstellingen">
      <div class="tool-switch" role="group" aria-label="Weergavehulpmiddelen">
        <button id="reset-camera" type="button" title="Herstel Passage-camera">Passage</button>
      </div>
    </div>

    <div id="loading">Render wordt opgebouwd...</div>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const sceneHost = document.querySelector("#scene");
    const mainHost = document.querySelector("main");
    const loading = document.querySelector("#loading");
    const deckAreaValue = document.querySelector("#deck-area-value");
    const oldAreaValue = document.querySelector("#old-area-value");
    const totalAreaValue = document.querySelector("#total-area-value");
    const resetButton = document.querySelector("#reset-camera");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    sceneHost.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9e5e8);
    const perspectiveFog = new THREE.Fog(0xd9e5e8, 17, 46);
    scene.fog = perspectiveFog;

    const planScale = 18;
    const planOriginX = 75.6;
    const planOriginY = 267.181;
    const siteX = value => (value - planOriginX) / planScale;
    const siteZ = value => -(value - planOriginY) / planScale;
    const planXFromSite = value => value * planScale + planOriginX;
    const planYFromSiteZ = value => planOriginY - value * planScale;
    const finishedGroundOffset = 0.1;
    const frontGroundY = -0.08;
    const deckTop = 0.061;
    const terrainSurfaceClearance = 0.01;
    const terraceRise = 0.3;
    const terraceSurfaceY = deckTop + terraceRise;
    const rearGardenFrontPlanY = 536.05;
    const terrainSlopeStartPlanY = 257.415865;
    const rearBoundaryPlanY = 14.918;
    const rearGardenDrop = 0.64;
    const terrainLevelAtPlanY = planY => deckTop - rearGardenDrop * THREE.MathUtils.clamp(
      (terrainSlopeStartPlanY - planY) / (terrainSlopeStartPlanY - rearBoundaryPlanY),
      0,
      1
    );
    const groundLevelAtPlanY = planY => planY > rearGardenFrontPlanY
      ? frontGroundY
      : terrainLevelAtPlanY(planY);
    const terrainLevelAtWorldZ = z => groundLevelAtPlanY(planOriginY - z * planScale);

    const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.05, 220);
    const initialCameraZ = -4.65;
    const initialCamera = new THREE.Vector3(-0.5, 1.65, initialCameraZ);
    const initialTarget = new THREE.Vector3(-0.42, 1.05, -0.45);
    camera.position.copy(initialCamera);

    const controls = new OrbitControls(camera, mainHost);
    controls.target.copy(initialTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 1.2;
    controls.maxDistance = 120;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const palette = {
      charcoal: 0x0a0a0d,
      charcoalSoft: 0x354044,
      wall: 0xf4f2ed,
      wallWarm: 0xf4f2ed,
      timber: 0x9b6c3f,
      timberDark: 0x694527,
      timberLight: 0xbc8957,
      stone: 0x78868b,
      stoneEdge: 0x58666c,
      lawn: 0x65815a,
      hedge: 0x3f6545,
      leaf: 0x547a4c,
      leafLight: 0x6f945e,
      soil: 0x6f5841,
      cushion: 0xd8cbb8,
      metal: 0x30383b
    };

    const standard = (color, roughness = 0.72, metalness = 0) =>
      new THREE.MeshStandardMaterial({ color, roughness, metalness });

    function makeCrepiTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const context = canvas.getContext("2d");
      const image = context.createImageData(canvas.width, canvas.height);
      const random = seededRandom(9005);

      for (let index = 0; index < image.data.length; index += 4) {
        const grain = 235 + Math.floor(random() * 18);
        image.data[index] = grain;
        image.data[index + 1] = grain;
        image.data[index + 2] = grain - 2;
        image.data[index + 3] = 255;
      }
      context.putImageData(image, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 4);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const crepiTexture = makeCrepiTexture();
    const crepiMaterial = new THREE.MeshStandardMaterial({
      map: crepiTexture,
      bumpMap: crepiTexture,
      bumpScale: 0.018,
      color: palette.wall,
      roughness: 0.96,
      metalness: 0
    });

    const materials = {
      wall: crepiMaterial,
      wallWarm: crepiMaterial,
      charcoal: standard(palette.charcoal, 0.34, 0.62),
      charcoalSoft: standard(palette.charcoalSoft, 0.5, 0.4),
      stone: standard(palette.stone, 0.54),
      stoneEdge: standard(palette.stoneEdge, 0.52),
      lawn: standard(palette.lawn, 1),
      publicGrass: standard(0x76916a, 1),
      cyclePath: standard(0xb9b7b1, 0.94),
      road: standard(0x777b7d, 0.92),
      paving: standard(0xb9b1a5, 0.9),
      gravel: standard(0xb7b0a4, 0.98),
      grassPaver: standard(0x78966d, 0.98),
      planting: standard(0x4f7148, 1),
      flowerBed: standard(0x657b4e, 1),
      hedge: standard(palette.hedge, 0.95),
      soil: standard(palette.soil, 1),
      cushion: standard(palette.cushion, 0.96),
      darkFabric: standard(0x4a504f, 0.98),
      interiorFloor: standard(0xb9aa97, 0.83),
      ceiling: standard(0xffffff, 0.94),
      white: standard(0xf0ece4, 0.86)
    };

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x9fb9c2,
      roughness: 0.12,
      metalness: 0,
      transmission: 0.58,
      transparent: true,
      opacity: 0.57,
      thickness: 0.035,
      ior: 1.45,
      clearcoat: 0.75,
      clearcoatRoughness: 0.12,
      side: THREE.DoubleSide
    });

    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value += 0x6d2b79f5;
        let result = value;
        result = Math.imul(result ^ result >>> 15, result | 1);
        result ^= result + Math.imul(result ^ result >>> 7, result | 61);
        return ((result ^ result >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeWoodTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 512;
      const context = canvas.getContext("2d");
      const random = seededRandom(24);

      context.fillStyle = "#9b6c3f";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#51341f";
      context.fillRect(0, 0, 5, canvas.height);
      context.fillStyle = "#bd8a59";
      context.fillRect(8, 0, 3, canvas.height);

      for (let index = 0; index < 90; index += 1) {
        const x = 14 + random() * 232;
        const y = random() * 512;
        const length = 40 + random() * 130;
        context.strokeStyle = `rgba(72, 43, 24, ${0.04 + random() * 0.08})`;
        context.lineWidth = 0.7 + random();
        context.beginPath();
        context.moveTo(x, y);
        context.bezierCurveTo(x + 8, y + length * 0.25, x - 8, y + length * 0.72, x + 2, y + length);
        context.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const woodTexture = makeWoodTexture();
    const woodMaterial = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0xffffff,
      roughness: 0.68,
      metalness: 0,
      side: THREE.DoubleSide
    });
    const woodEdgeMaterial = standard(palette.timberDark, 0.75);

    function addBox(parent, width, height, depth, material, x, y, z, options = {}) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = options.castShadow ?? true;
      mesh.receiveShadow = options.receiveShadow ?? true;
      parent.add(mesh);
      return mesh;
    }

    function makeDeckGeometry(points, uvScale = { x: 0.145, z: 2.4 }) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];

      points.forEach(([x, z]) => {
        positions.push(x, 0, z);
        uvs.push(x / uvScale.x, z / uvScale.z);
      });
      const indices = THREE.ShapeUtils.triangulateShape(
        points.map(([x, z]) => new THREE.Vector2(x, z)),
        []
      ).flat();

      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function addDeck(parent, points, y = 0.035) {
      const deck = new THREE.Mesh(makeDeckGeometry(points), woodMaterial);
      deck.position.y = y;
      deck.receiveShadow = true;
      parent.add(deck);
      return deck;
    }

    function addGlassWallAlongZ(parent, zStart, zEnd, x = 0, panelCount = 2) {
      const length = zEnd - zStart;
      addBox(parent, 0.035, 2.7, length, glassMaterial, x, 1.45, zStart + length / 2, { castShadow: false });
      addBox(parent, 0.075, 0.075, length, materials.charcoal, x, 0.105, zStart + length / 2);
      addBox(parent, 0.075, 0.075, length, materials.charcoal, x, 2.795, zStart + length / 2);
      for (let index = 0; index <= panelCount; index += 1) {
        addBox(parent, 0.075, 2.78, 0.055, materials.charcoal, x, 1.45, zStart + length * index / panelCount);
      }
    }

    function addGlassWallAlongX(parent, xStart, xEnd, z, panelCount = 2) {
      const width = xEnd - xStart;
      addBox(parent, width, 2.7, 0.035, glassMaterial, xStart + width / 2, 1.45, z, { castShadow: false });
      addBox(parent, width, 0.075, 0.075, materials.charcoal, xStart + width / 2, 0.105, z);
      addBox(parent, width, 0.075, 0.075, materials.charcoal, xStart + width / 2, 2.795, z);
      for (let index = 0; index <= panelCount; index += 1) {
        addBox(parent, 0.055, 2.78, 0.075, materials.charcoal, xStart + width * index / panelCount, 1.45, z);
      }
    }

    function addVerticalCladding(parent, x, zStart, zEnd, height = 2.82, outward = -1) {
      const boardWidth = 0.135;
      const boardCount = Math.ceil((zEnd - zStart) / boardWidth);
      const colors = [palette.timber, palette.timberLight, 0x8b5d35, 0xa87849];
      for (let index = 0; index < boardCount; index += 1) {
        const start = zStart + index * boardWidth;
        const width = Math.min(boardWidth - 0.012, zEnd - start);
        if (width <= 0) continue;
        const material = standard(colors[index % colors.length], 0.78);
        addBox(parent, 0.045, height, width, material, x + outward * 0.025, height / 2 + 0.08, start + width / 2);
      }
    }

    function addPlanSurface(parent, points, material, y = 0, holes = []) {
      const shape = new THREE.Shape();
      points.forEach(([planX, planY], index) => {
        const x = siteX(planX);
        const shapeY = -siteZ(planY);
        if (index === 0) shape.moveTo(x, shapeY);
        else shape.lineTo(x, shapeY);
      });
      shape.closePath();
      holes.forEach(holePoints => {
        const hole = new THREE.Path();
        holePoints.forEach(([planX, planY], index) => {
          const x = siteX(planX);
          const shapeY = -siteZ(planY);
          if (index === 0) hole.moveTo(x, shapeY);
          else hole.lineTo(x, shapeY);
        });
        hole.closePath();
        shape.holes.push(hole);
      });
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = y;
      mesh.receiveShadow = true;
      mesh.userData.holeCount = holes.length;
      parent.add(mesh);
      return mesh;
    }

    function addPlanTerrain(parent, points, material, surfaceOffset = 0) {
      const shape = new THREE.Shape();
      points.forEach(([planX, planY], index) => {
        const x = siteX(planX);
        const shapeY = -siteZ(planY);
        if (index === 0) shape.moveTo(x, shapeY);
        else shape.lineTo(x, shapeY);
      });
      shape.closePath();
      const geometry = new THREE.ShapeGeometry(shape);
      const positions = geometry.getAttribute("position");
      for (let index = 0; index < positions.count; index += 1) {
        const planY = positions.getY(index) * planScale + planOriginY;
        positions.setZ(index, terrainLevelAtPlanY(planY) + surfaceOffset);
      }
      positions.needsUpdate = true;
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addPlanOutline(parent, points, color, y) {
      const vertices = points.map(([planX, planY]) => new THREE.Vector3(siteX(planX), y, siteZ(planY)));
      const outline = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(vertices),
        new THREE.LineBasicMaterial({ color, depthTest: false })
      );
      outline.renderOrder = 26;
      parent.add(outline);
      return outline;
    }

    function planRect(x1, y1, x2, y2) {
      return [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
    }

    const studioAngle = THREE.MathUtils.degToRad(7.794923);
    const studioRearPlanX = 81.98330690803415;
    const studioPathStartX = siteX(studioRearPlanX);
    const poolShiftMeters = Math.tan(studioAngle) * studioPathStartX;
    const poolNnoShift = 0.06;
    const poolRearZ = -poolShiftMeters;
    const poolOuterWidth = 3.26;
    const poolOuterLength = 7.5;
    const poolInnerWidth = 3.0;
    const poolInnerLength = 7.24;
    const poolWaterHeight = 1.47;

    const world = new THREE.Group();
    // Plan mode is the canonical orientation: house/pool left, driveway/studio right.
    world.scale.x = -1;
    scene.add(world);
    const planOnly = new THREE.Group();
    planOnly.visible = false;
    world.add(planOnly);

    const parcelOuterRing = [
      [-0.262, 14.918], [120.998, 17.261], [140.665, 161.659],
      [240.137, 892.098], [239.769, 945.156], [239.664, 944.428],
      [238.798, 1040.061], [159.889, 1040.041], [147.154, 1040.038],
      [115.604, 1040.03], [114.605, 1040.029], [0, 1040],
      [-0.03, 904.941], [-0.214, 198.773], [-0.225, 159.546]
    ];
    const pointAtPlanY = (start, end, planY) => {
      const ratio = (planY - start[1]) / (end[1] - start[1]);
      return [THREE.MathUtils.lerp(start[0], end[0], ratio), planY];
    };
    const rearGardenFrontLeft = pointAtPlanY([-0.214, 198.773], [-0.03, 904.941], rearGardenFrontPlanY);
    const rearGardenFrontRight = pointAtPlanY([140.665, 161.659], [240.137, 892.098], rearGardenFrontPlanY);
    const terrainSlopeStartLeft = pointAtPlanY([-0.214, 198.773], [-0.03, 904.941], terrainSlopeStartPlanY);
    const terrainSlopeStartRight = pointAtPlanY([140.665, 161.659], [240.137, 892.098], terrainSlopeStartPlanY);
    const slopedRearTerrainRing = [
      terrainSlopeStartLeft, [-0.214, 198.773], [-0.225, 159.546], [-0.262, 14.918],
      [120.998, 17.261], [140.665, 161.659], terrainSlopeStartRight
    ];
    const flatRearTerrainRing = [
      rearGardenFrontLeft, rearGardenFrontRight, terrainSlopeStartRight, terrainSlopeStartLeft
    ];

    function addFenceWithJasmine(xStart, zStart, xEnd, zEnd, seed) {
      const fence = new THREE.Group();
      const deltaX = xEnd - xStart;
      const deltaZ = zEnd - zStart;
      const length = Math.hypot(deltaX, deltaZ);
      const height = 1.8;
      const fenceMaterial = standard(0x293630, 0.62, 0.35);
      const wireMaterial = new THREE.LineBasicMaterial({ color: 0x3b4a42, transparent: true, opacity: 0.78 });
      const random = seededRandom(seed);
      const startLevel = terrainLevelAtWorldZ(zStart);
      const endLevel = terrainLevelAtWorldZ(zEnd);
      const levelAtDistance = distance => THREE.MathUtils.lerp(startLevel, endLevel, distance / length);
      const slopeAngle = Math.atan2(endLevel - startLevel, length);

      fence.position.set(xStart, 0, zStart);
      fence.rotation.y = -Math.atan2(deltaZ, deltaX);
      world.add(fence);

      const postCount = Math.ceil(length / 2);
      for (let index = 0; index <= postCount; index += 1) {
        const distance = length * index / postCount;
        addBox(fence, 0.07, 1.92, 0.07, fenceMaterial, distance, levelAtDistance(distance) + 0.96, 0);
      }
      for (const railHeight of [0.22, 0.9, 1.62]) {
        const rail = addBox(fence, length, 0.035, 0.045, fenceMaterial, length / 2, (startLevel + endLevel) / 2 + railHeight, 0);
        rail.rotation.z = slopeAngle;
      }

      const wirePoints = [];
      for (let x = 0; x <= length; x += 0.2) {
        const level = levelAtDistance(x);
        wirePoints.push(new THREE.Vector3(x, level + 0.12, 0), new THREE.Vector3(x, level + height, 0));
      }
      for (let y = 0.12; y <= height; y += 0.2) {
        wirePoints.push(new THREE.Vector3(0, startLevel + y, 0), new THREE.Vector3(length, endLevel + y, 0));
      }
      fence.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(wirePoints), wireMaterial));

      const leafGeometry = new THREE.IcosahedronGeometry(0.17, 1);
      const flowerGeometry = new THREE.SphereGeometry(0.035, 6, 5);
      const leafMaterials = [
        standard(0x315b3b, 0.96),
        standard(0x47764a, 0.96),
        standard(0x648b55, 0.96)
      ];
      const flowerMaterial = standard(0xf5f1df, 0.94);

      for (let index = 0; index < Math.ceil(length * 7); index += 1) {
        const leaf = new THREE.Mesh(leafGeometry, leafMaterials[index % leafMaterials.length]);
        const distance = random() * length;
        leaf.position.set(distance, levelAtDistance(distance) + 0.18 + random() * 1.55, 0.035 + random() * 0.08);
        leaf.scale.set(0.65 + random() * 0.8, 0.8 + random() * 1.15, 0.42 + random() * 0.45);
        leaf.rotation.set(random() * 0.5, random() * Math.PI, random() * 0.45);
        leaf.castShadow = true;
        fence.add(leaf);
      }

      for (let index = 0; index < Math.ceil(length * 2.4); index += 1) {
        const flower = new THREE.Mesh(flowerGeometry, flowerMaterial);
        const distance = random() * length;
        flower.position.set(distance, levelAtDistance(distance) + 0.35 + random() * 1.35, 0.16);
        flower.castShadow = true;
        fence.add(flower);
      }
    }

    function addDimensionBetween(start, end, label, y = 0.22) {
      const material = new THREE.LineBasicMaterial({ color: 0x5f3927, depthTest: false });
      const deltaX = end.x - start.x;
      const deltaZ = end.z - start.z;
      const length = Math.hypot(deltaX, deltaZ);
      const tickX = -deltaZ / length * 0.1;
      const tickZ = deltaX / length * 0.1;
      const points = [
        new THREE.Vector3(start.x, y, start.z), new THREE.Vector3(end.x, y, end.z),
        new THREE.Vector3(start.x - tickX, y, start.z - tickZ), new THREE.Vector3(start.x + tickX, y, start.z + tickZ),
        new THREE.Vector3(end.x - tickX, y, end.z - tickZ), new THREE.Vector3(end.x + tickX, y, end.z + tickZ)
      ];
      const line = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), material);
      line.renderOrder = 15;
      dimensions.add(line);
      const sprite = makeTextSprite(label);
      sprite.position.set((start.x + end.x) / 2, y + 0.28, (start.z + end.z) / 2);
      dimensions.add(sprite);
      return { line, sprite };

    function formatMetersLabel(value) {

    const openPergolaStart = { x: poolNnoShift - coping, z: poolRearZ };

      furniture: {

        coffeeTableAxis: coffeeTableLength > coffeeTableWidth ? "studio-long-axis" : "cross-axis",
        deskAxis: deskLength > deskWidth ? "studio-long-axis" : "cross-axis",
        pergolaSofaAxis: 1.72 > 0.73 ? "studio-long-axis" : "cross-axis",
        sliderEntryClearance: coffeeTableX - coffeeTableWidth / 2,
        deskToBathroomClearance: (687 - 90) / 75 - (deskZ + deskLength / 2),
        sunbedCount: sunbeds.children.filter(child => child.name.startsWith("pool-terrace-sunbed-")).length,
        sunbedSize: [sunbedLength, sunbedWidth],
        sunbedBoundaryClearance,

        sunbedsFacePool: sunbeds.children.every(child => child.rotation.y === sunbedRotationY)
          && sunbedRotationY === -Math.PI / 2,
        tankHatchAccessible: tankHatch.name === "rainwater-tank-removable-timber-hatch",
        poolTerraceDeckArea
      },
      sourcePlan: "tuinstudio.html",
      canonicalWorldScaleX: world.scale.x
    };
    console.assert(geometryChecks.minimum >= 0.25, "Upper construction joint must preserve at least 0.25 m clearance after the NNO pool shift");
    console.assert(geometryChecks.pergolaEnd >= 0.6, "Glass-line construction joint must preserve at least 0.60 m clearance after the NNO pool shift");
    console.assert(Math.abs(geometryChecks.poolShift - 0.048546) < 0.00001, "Pool must move 4.85 cm toward the house");
    console.assert(Math.abs(geometryChecks.poolNnoShift - 0.06) < 1e-9, "Pool offset must keep the 1.00 m outer-edge boundary strip in plan");
    console.assert(poolOuterLength === 7.5 && poolOuterWidth === 3.26, "LPW City 75 outer dimensions must be 7.50 x 3.26 m");
    console.assert(poolInnerLength === 7.24 && poolInnerWidth === 3.0, "LPW City 75 inner dimensions must be 7.24 x 3.00 m");
    console.assert(Math.abs(poolWaterHeight - 1.47) < 1e-9, "LPW City 75 water height must be 1.47 m");
    console.assert(finishedGroundOffset === 0.1, "Final render state must be raised to the 0.10 m nulpuntlijn");
    console.assert(Math.abs(terraceWidth - 6.6) < 0.001 && Math.abs(terraceDepth - 3) < 0.001, "Terrace must be 6.60 x 3.00 m");
    console.assert(Math.abs(geometryChecks.integratedDeck.terraceLineDeviation) < 1e-9
      && geometryChecks.integratedDeck.poolTimberEndsAtTerrace,
    "Timber deck must meet the existing 3.00 m terrace edge");
    console.assert(Math.abs(geometryChecks.permitFree.boundaryStrip - 1) < 1e-9,
      "Pool/deck outer edge must remain 1.00 m from the parcel boundary");
    console.assert(geometryChecks.siteLevels.poolAndDeck === 0, "Pool coping and timber deck must define level 0.00");
    console.assert(Math.abs(geometryChecks.siteLevels.terrace - 0.3) < 1e-9, "Existing terrace must be 0.30 m above pool and deck level");
    console.assert(Math.abs(geometryChecks.siteLevels.rearBoundary + 0.64) < 1e-9, "Rear terrain must finish at -0.64 m relative to pool and deck level");
    console.assert(Math.abs(terrainLevelAtPlanY(rearGardenFrontPlanY) - deckTop) < 1e-9, "Rear garden must remain at level 0.00 from the house");
    console.assert(Math.abs(terrainLevelAtPlanY(terrainSlopeStartPlanY) - deckTop) < 1e-9, "Terrain slope must start only at the garden end of the studio");
    console.assert(geometryChecks.terrain.surfaceClearance >= 0.01, "Terrain render surface must remain below the timber deck to prevent z-fighting");
    console.assert(geometryChecks.terrain.poolOpeningCount === 1, "Flat terrain must contain one opening for the pool");
    console.assert(geometryChecks.rainwaterTank.poolClearance > 0.58 && geometryChecks.rainwaterTank.poolClearance < 0.62,
      "Tank clearance must remain around 0.60 m with LPW City 75 length");
    console.assert(geometryChecks.layout.poolPlanX[1] < geometryChecks.layout.studioPlanX[0], "Pool must remain left of the studio");
    console.assert(geometryChecks.layout.housePlanX[1] <= geometryChecks.layout.drivewayPlanX[0], "House must remain left of the driveway");
    console.assert(Math.abs(geometryChecks.timberPlatform.studioEdgeLength - 2.522) < 0.001, "Timber platform must follow the pergola glass line");
    console.assert(geometryChecks.timberPlatform.skewAtPool < 0.1, "Timber platform must meet the shifted pool with less than 0.10 m skew");
    console.assert(geometryChecks.timberPlatform.glassLineDeviation < 1e-9, "Platform edge and pergola glass must be collinear");
    console.assert(geometryChecks.timberPlatform.rearLineDeviation < 0.01, "Lateral pool shift must keep the rear-line offset below 0.01 m");
    console.assert(Math.abs(geometryChecks.chokePoints.openPergolaWidth - 4.497936) < 0.002,
      "Open-pergola chokepoint must be about 4.50 m including the timber coping");
    console.assert(Math.abs(geometryChecks.chokePoints.glassLineWidth - 0.843179) < 0.002,
      "Glass-line chokepoint must be about 0.84 m including the timber coping");
    console.assert(geometryChecks.chokePoints.copingIncluded === 0.2,
      "Chokepoint dimensions must include the 0.20 m timber pool coping");
    console.assert(geometryChecks.chokePoints.dimensionLineCount === 2,
      "Maten overlay must show only the two full chokepoint widths");
    console.assert(geometryChecks.integratedDeck.area > 48 && geometryChecks.integratedDeck.area < 50,
      "Merged pool-edge deck area must stay within the current LPW City 75 design envelope");
    console.assert(geometryChecks.integratedDeck.sideRun === 10, "Deck must run along the complete studio side");
    console.assert(geometryChecks.integratedDeck.innerReturnDepth > 2 && geometryChecks.integratedDeck.innerReturnDepth < 2.1, "Pool-side return must fill the studio-to-terrace gap");
    console.assert(geometryChecks.integratedDeck.outerReturnDepth > 2.5 && geometryChecks.integratedDeck.outerReturnDepth < 2.7, "Outer return must extend to the terrace line");
    console.assert(geometryChecks.integratedDeck.terraceLineDeviation < 1e-9, "Studio-end timber edge must follow the terrace line");
    console.assert(geometryChecks.integratedDeck.pointCount === 17, "Merged deck must align the shifted pool and 1.00 m boundary without duplicate corners");
    console.assert(geometryChecks.integratedDeck.straightPoolLine, "Pool-side deck edge must stay on one straight line to the terrace");
    console.assert(geometryChecks.integratedDeck.unifiedWoodSurface, "Timber coping and deck must share one flush, texture-aligned surface");
    console.assert(geometryChecks.permitFree.uncoveredUnionArea < geometryChecks.permitFree.limit,
      "Remaining non-permitted model area should remain under the 80 m² reference limit");
    console.assert(Math.abs(geometryChecks.integratedDeck.poolTimberWidth - 0.2) < 1e-9
      && geometryChecks.integratedDeck.poolTimberEndsAtTerrace,
    "The 20 cm timber strip must continue from the pool to the terrace");
    console.assert(geometryChecks.integratedDeck.poolSideTimberCoping, "Pool border beside the studio must use the deck timber material");
    console.assert(geometryChecks.integratedDeck.poolRearBlueStoneCoping, "WNW pool border must remain blue stone");
    console.assert(geometryChecks.integratedDeck.poolOzoTimberCoping, "OZO pool border must continue in timber to the water");
    console.assert(geometryChecks.integratedDeck.poolZzwTimberReturn && geometryChecks.integratedDeck.poolZzwTimberReturnLength === 0.2, "Timber must return exactly 0.20 m into the ZZW pool edge");
    console.assert(geometryChecks.integratedDeck.poolZzwBlueStoneCoping && Math.abs(geometryChecks.integratedDeck.poolZzwBlueStoneLength - (poolOuterLength - coping)) < 1e-9, "ZZW pool coping must retain blue stone beyond the 0.20 m timber return");
    console.assert(geometryChecks.integratedDeck.poolSideCrepiWall, "Opaque pool-facing wall must remain crepi");
    console.assert(geometryChecks.integratedDeck.poolSideBlueStonePlinth, "Opaque pool-facing wall must retain its blue-stone plinth");
    console.assert(geometryChecks.integratedDeck.cornerPostSize.every(value => Math.abs(value - 0.2) < 1e-9) && geometryChecks.integratedDeck.cornerPostRal === "RAL 9005", "Slider corner post must be 20 x 20 cm in RAL 9005");
    console.assert(geometryChecks.integratedDeck.poolSideSliderCount === 1 && Math.abs(geometryChecks.integratedDeck.poolSideSliderWidth - 5.2) < 1e-9, "Pool-facing façade must use one full-width 5.20 m slider");
    console.assert(geometryChecks.integratedDeck.poolSideSliderPanels === 2, "Pool-facing slider must have two panels");
    console.assert(Math.abs(geometryChecks.integratedDeck.pergolaSliderWidth - 4) < 1e-9 && geometryChecks.integratedDeck.pergolaSliderPanels === 2, "WNW façade must contain the 4.00 m two-panel slider");
    console.assert(geometryChecks.closedStorageFacade.exteriorDoorCount === 0 && geometryChecks.closedStorageFacade.wallSegments === 1, "ZZW storage façade must be continuous and have no exterior door");
    console.assert(geometryChecks.closedStorageFacade.crepiWall, "Closed storage exterior walls must remain white crepi");
    console.assert(geometryChecks.closedStorageFacade.blueStonePlinth, "Closed storage exterior walls must retain its blue-stone plinth");
    console.assert(geometryChecks.studioDesign.nnoWindowCount === 0 && geometryChecks.studioDesign.nnoPrivacyWall, "NNO façade must be a continuous privacy wall without windows");
    console.assert(geometryChecks.studioDesign.xinnixDoorCount === 2 && Math.abs(geometryChecks.studioDesign.xinnixDoorWidth - 0.73) < 1e-9, "Bathroom and storage must use two 73 cm Xinnix X40 doors opening into the office");
    console.assert(geometryChecks.studioDesign.showerSize[0] === 1 && geometryChecks.studioDesign.showerSize[1] === 0.8 && geometryChecks.studioDesign.showerHalfWall && geometryChecks.studioDesign.showerGlass, "Bathroom must contain the 80 x 100 cm shower with half-height wall and fixed glass");
    console.assert(geometryChecks.studioDesign.boiler && geometryChecks.studioDesign.technicalZone[0] === 1 && geometryChecks.studioDesign.technicalZone[1] === 1.5, "Storage must contain the Bulex boiler left of the 1.00 x 1.50 m pool-equipment zone");

      && Math.abs(geometryChecks.studioDesign.fireplaceEnvelopeDepth - 0.524) < 1e-9
      && Math.abs(geometryChecks.studioDesign.fireplaceBodyWidth - 0.479) < 1e-9
      && geometryChecks.studioDesign.fireplaceGlassFaceCount === 2,
    "Fireplace must be the rotated True Vision 550DV see-through version with two glass faces");
    console.assert(geometryChecks.studioDesign.airco, "Air-conditioning unit must remain on the office side of the storage partition");
    console.assert(Object.values(geometryChecks.furniture).slice(0, 4).every(axis => axis === "studio-long-axis"), "Sofa, tables and desk must follow the studio long axis");
    console.assert(geometryChecks.furniture.sliderEntryClearance > 2.2, "Furniture must preserve a clear route from the pool-side slider");
    console.assert(geometryChecks.furniture.deskToBathroomClearance > 0.5, "Desk must clear the bathroom zone");
    console.assert(Number.isFinite(geometryChecks.permitFree.uncoveredUnionArea), "Regulatory area calculation must produce a finite value");
    console.assert(geometryChecks.furniture.sunbedCount === 2 && geometryChecks.furniture.sunbedSize[0] === 1.8 && geometryChecks.furniture.sunbedSize[1] === 0.52, "Pool-terrace platform must contain two 1.80 x 0.52 m sunbeds");
    console.assert(geometryChecks.furniture.sunbedBoundaryClearance >= 0.1, "Sunbeds must remain inside the 1.00 m boundary strip");
    console.assert(geometryChecks.furniture.sunbedRowGap >= 0.1, "Sunbeds must retain at least 0.10 m between rows");

    console.assert(geometryChecks.canonicalWorldScaleX === -1, "All views must retain the Plan orientation");

      "Dimensions and timber deck must always remain visible");
    window.__renderMetrics = geometryChecks;

    document.querySelector(".control-dock").addEventListener("pointerdown", event => event.stopPropagation());

    function setPassageView() {
      console.assert(world.scale.x === -1, "Camera changes must not mirror the site");
      window.__renderView = "passage";
      planOnly.visible = false;
      scene.fog = perspectiveFog;
      camera.up.set(0, 1, 0);
      camera.position.copy(initialCamera);
      controls.target.copy(initialTarget);
      controls.update();
    }

    resetButton.addEventListener("click", () => {
      setPassageView();
    });

    setPassageView();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let animationFrame;
    function render() {
      waterUniforms.time.value = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
      animationFrame = requestAnimationFrame(render);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        cancelAnimationFrame(animationFrame);
      } else {
        render();
      }
    });

    window.__captureRender = (width, height) => {
      const previousSize = renderer.getSize(new THREE.Vector2());
      const previousPixelRatio = renderer.getPixelRatio();
      const previousAspect = camera.aspect;
      const previousStyle = [renderer.domElement.style.width, renderer.domElement.style.height];

      renderer.setPixelRatio(1);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      controls.update();
      renderer.render(scene, camera);
      const image = renderer.domElement.toDataURL("image/png");

      renderer.setPixelRatio(previousPixelRatio);
      renderer.setSize(previousSize.x, previousSize.y, false);
      renderer.domElement.style.width = previousStyle[0];
      renderer.domElement.style.height = previousStyle[1];
      camera.aspect = previousAspect;
      camera.updateProjectionMatrix();
      return image;
    };

    render();
    loading.classList.add("ready");
    window.__renderReady = true;
    document.documentElement.dataset.geometry = "verified";
