<!DOCTYPE html>
<html lang="nl">
<head>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuinstudio V2 - 3,10 m gebouw met overdekt pad</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px;
      border: 1px solid var(--cp-border);
      border-radius: 10px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }
    header { margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0; color: var(--cp-text-muted); }
    svg { display: block; width: 100%; height: auto; }
    .wall { fill: var(--cp-border); stroke: var(--cp-text); stroke-width: 1.3; }
    .room { fill: var(--cp-bg-elevated); }
    .wet { fill: var(--cp-surface-soft); }
    .storage { fill: var(--cp-accent-soft); }
    .roof { fill: none; stroke: var(--cp-accent); stroke-width: 2; stroke-dasharray: 8 5; }
    .slab { fill: var(--cp-surface-soft); stroke: var(--cp-border-strong); stroke-width: 1; }
    .deck { fill: var(--cp-highlight); stroke: var(--cp-accent); stroke-width: 1; }
    .deck-board { stroke: var(--cp-accent); stroke-width: .45; opacity: .65; }
    .glass { fill: var(--cp-highlight); stroke: var(--cp-link); stroke-width: 1.5; }
    .fixture { fill: var(--cp-surface); stroke: var(--cp-border-strong); stroke-width: 1.2; }
    .water { fill: none; stroke: var(--cp-link); stroke-width: 1; }
    .furniture { fill: var(--cp-surface-soft); stroke: var(--cp-text-muted); stroke-width: 1; }
    .aluminium { fill: var(--cp-surface); stroke: var(--cp-border-strong); stroke-width: 1.6; }
    .cushion { fill: var(--cp-bg-elevated); stroke: var(--cp-border); stroke-width: 1; }
    .corner-post { fill: var(--cp-text); stroke: var(--cp-text); stroke-width: 1; }
    .monitor { fill: var(--cp-text); stroke: var(--cp-border-strong); stroke-width: 1; }
    .chair { fill: var(--cp-surface); stroke: var(--cp-text-muted); stroke-width: 1.2; }
    .dimension { fill: none; stroke: var(--cp-text-muted); stroke-width: .8; }
    .partition { fill: var(--cp-border); stroke: var(--cp-text-muted); stroke-width: 1; }
    .door { fill: none; stroke: var(--cp-success); stroke-width: 1.2; }
    .label { fill: var(--cp-text); font-size: 9px; font-weight: 700; letter-spacing: 0; }
    .small { fill: var(--cp-text-muted); font-size: 6px; letter-spacing: 0; }
    .measure { fill: var(--cp-text-muted); font-size: 7px; font-weight: 600; letter-spacing: 0; }
    .note { fill: var(--cp-accent); font-size: 7px; font-weight: 700; letter-spacing: 0; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--cp-border);
      color: var(--cp-text-muted);
      font-size: 12px;
    }
    @media (max-width: 700px) {
      body { padding: 0; }
      main { padding: 12px; border: 0; border-radius: 0; }
      h1 { font-size: 20px; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Tuinstudio V2</h1>
      <p>3,10 m gebouwbreedte op bestaande fundering en dak van 4,00 × 10,00 m</p>
    </header>

    <svg viewBox="30 20 900 500" role="img" aria-labelledby="plan-title plan-desc">
      <title id="plan-title">Grondplan tuinstudio V2</title>
      <desc id="plan-desc">Compacte tuinstudio met overdekt houten pad van 90 centimeter, badkamer, berging, lounge en pergola.</desc>
      <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
          <path d="M0,0 L6,3 L0,6 Z" fill="var(--cp-text-muted)" />
        </marker>
      </defs>

      <!-- Existing 4 x 10 m foundation and unchanged roof projection. -->
      <rect class="slab" x="90" y="75" width="750" height="300" />
      <rect class="roof" x="90" y="75" width="750" height="300" />

      <!-- One continuous timber surface: pergola plus 0.90 m foundation path. -->
      <path id="continuous-timber-deck" class="deck" d="M90,75 H278 V307.5 H840 V375 H90 Z" />
      <g class="deck-board">
        <line x1="108" y1="75" x2="108" y2="375" /><line x1="126" y1="75" x2="126" y2="375" />
        <line x1="144" y1="75" x2="144" y2="375" /><line x1="162" y1="75" x2="162" y2="375" />
        <line x1="180" y1="75" x2="180" y2="375" /><line x1="198" y1="75" x2="198" y2="375" />
        <line x1="216" y1="75" x2="216" y2="375" /><line x1="234" y1="75" x2="234" y2="375" />
        <line x1="252" y1="75" x2="252" y2="375" /><line x1="270" y1="75" x2="270" y2="375" />
      </g>

      <!-- Board joints continue in the same direction along the path. -->
      <g class="deck-board">
        <line x1="296" y1="307.5" x2="296" y2="375" /><line x1="314" y1="307.5" x2="314" y2="375" />
        <line x1="332" y1="307.5" x2="332" y2="375" /><line x1="350" y1="307.5" x2="350" y2="375" />
        <line x1="368" y1="307.5" x2="368" y2="375" /><line x1="386" y1="307.5" x2="386" y2="375" />
        <line x1="404" y1="307.5" x2="404" y2="375" /><line x1="422" y1="307.5" x2="422" y2="375" />
        <line x1="440" y1="307.5" x2="440" y2="375" /><line x1="458" y1="307.5" x2="458" y2="375" />
        <line x1="476" y1="307.5" x2="476" y2="375" /><line x1="494" y1="307.5" x2="494" y2="375" />
        <line x1="512" y1="307.5" x2="512" y2="375" /><line x1="530" y1="307.5" x2="530" y2="375" />
        <line x1="548" y1="307.5" x2="548" y2="375" /><line x1="566" y1="307.5" x2="566" y2="375" />
        <line x1="584" y1="307.5" x2="584" y2="375" /><line x1="602" y1="307.5" x2="602" y2="375" />
        <line x1="620" y1="307.5" x2="620" y2="375" /><line x1="638" y1="307.5" x2="638" y2="375" />
        <line x1="656" y1="307.5" x2="656" y2="375" /><line x1="674" y1="307.5" x2="674" y2="375" />
        <line x1="692" y1="307.5" x2="692" y2="375" /><line x1="710" y1="307.5" x2="710" y2="375" />
        <line x1="728" y1="307.5" x2="728" y2="375" /><line x1="746" y1="307.5" x2="746" y2="375" />
        <line x1="764" y1="307.5" x2="764" y2="375" /><line x1="782" y1="307.5" x2="782" y2="375" />
        <line x1="800" y1="307.5" x2="800" y2="375" /><line x1="818" y1="307.5" x2="818" y2="375" />
      </g>

      <!-- Reduced 3.10 m enclosure. -->
      <rect class="room" x="278" y="75" width="562" height="232.5" />
      <rect class="room" x="296" y="93" width="270" height="196.5" />
      <rect class="wet" x="574" y="93" width="127.5" height="196.5" />
      <rect class="storage" x="709.5" y="93" width="112.5" height="196.5" />

      <!-- Exterior walls. -->
      <rect class="wall" x="278" y="75" width="562" height="18" />
      <rect class="wall" x="278" y="289.5" width="562" height="18" />
      <rect class="wall" x="278" y="75" width="18" height="232.5" />
      <rect class="wall" x="822" y="75" width="18" height="232.5" />

      <!-- Internal partitions. -->
      <rect class="partition" x="566" y="93" width="8" height="122" />
      <rect class="partition" x="566" y="275" width="8" height="14.5" />
      <rect class="partition" x="701.5" y="93" width="8" height="196.5" />

      <!-- Two sliders meet on one 20 x 20 cm RAL9005 aluminium post. -->
      <rect class="glass" x="293" y="289.5" width="273" height="18" />
      <line class="dimension" x1="384" y1="289.5" x2="384" y2="307.5" />
      <line class="dimension" x1="475" y1="289.5" x2="475" y2="307.5" />
      <rect class="glass" x="278" y="100.5" width="18" height="192" />
      <line class="dimension" x1="278" y1="164.5" x2="296" y2="164.5" />
      <line class="dimension" x1="278" y1="228.5" x2="296" y2="228.5" />
      <rect class="corner-post" x="278" y="292.5" width="15" height="15" />
      <text class="small" x="294" y="316">RAL9005 post 20 x 20</text>

      <!-- North windows, including high bathroom window. -->
      <rect class="glass" x="330" y="75" width="180" height="18" />
      <rect class="glass" x="585" y="75" width="90" height="18" />
      <rect class="glass" x="750" y="75" width="60" height="18" />

      <!-- Bathroom pocket door. -->
      <line class="door" x1="566" y1="215" x2="566" y2="275" />
      <line class="door" x1="555.5" y1="245" x2="583.5" y2="245" marker-end="url(#arrow)" />

      <!-- RAL9005 aluminium storage door, opening inward. -->
      <rect x="754.5" y="289.5" width="67.5" height="18" fill="var(--cp-bg-elevated)" />
      <line class="door" x1="822" y1="289.5" x2="754.5" y2="222" stroke="var(--cp-text)" stroke-width="2" />
      <path class="door" d="M754.5,289.5 A67.5,67.5 0 0 1 822,222" stroke-dasharray="4 3" />
      <text class="small" x="785" y="258" text-anchor="middle">RAL9005 aluminium deur</text>

      <!-- Shower alcove: 80 x 100 clear, with full-height masonry walls on both sides. -->
      <rect class="fixture" x="574" y="93" width="60" height="75" />
      <line class="water" x1="574" y1="93" x2="634" y2="168" />
      <line class="water" x1="634" y1="93" x2="574" y2="168" />
      <circle class="water" cx="604" cy="130.5" r="10" />
      <rect class="partition" x="634" y="93" width="8" height="75" />
      <text class="small" x="604" y="176" text-anchor="middle">open douchefront</text>

      <!-- Dry zone: vanity opposite the pocket door; wall-hung toilet right of the shower. -->
      <rect class="fixture" x="667.75" y="215" width="33.75" height="60" />
      <ellipse class="water" cx="684.625" cy="245" rx="9" ry="13" />
      <circle class="water" cx="695" cy="245" r="2" />
      <rect class="fixture" x="656.75" y="93" width="30" height="37.5" rx="4" />
      <ellipse class="water" cx="671.75" cy="111.75" rx="10" ry="13" />
      <text class="small" x="620" y="235" text-anchor="middle">droge vrije zone 1,12 m</text>

      <!-- Storage shelves. -->
      <rect class="furniture" x="714" y="98" width="103" height="16" />
      <rect class="furniture" x="806" y="122" width="11" height="92" />
      <rect class="furniture" x="714" y="268" width="85" height="16" />

      <!-- Lounge / office: sofa on the long wall, desk rotated into the bathroom-side corner. -->
      <rect class="furniture" x="315" y="93" width="135" height="63.75" rx="5" />
      <line class="dimension" x1="324" y1="103" x2="441" y2="103" />
      <rect class="furniture" x="513.5" y="93" width="52.5" height="105" rx="2" />
      <rect class="monitor" x="551" y="122" width="8" height="47" rx="1" />
      <line class="dimension" x1="542" y1="145.5" x2="551" y2="145.5" />
      <circle class="chair" cx="490" cy="145.5" r="18" />
      <circle class="furniture" cx="430" cy="220" r="26.25" />
      <text class="small" x="382.5" y="166" text-anchor="middle">sofa 180 x 85</text>
      <text class="small" x="539.75" y="207" text-anchor="middle">hoekbureau 140 x 70</text>

      <!-- White aluminium lounge against the timber pergola wall, with pale cushions. -->
      <rect class="aluminium" x="120" y="93" width="129" height="54.75" rx="3" />
      <rect class="cushion" x="127" y="99" width="115" height="42" rx="4" />
      <line class="dimension" x1="129" y1="104" x2="240" y2="104" />
      <rect class="aluminium" x="155" y="185" width="52.5" height="33.75" rx="3" />
      <text class="small" x="184.5" y="160" text-anchor="middle">wit aluminium lounge 172 x 73</text>
      <text class="small" x="181" y="232" text-anchor="middle">lage tafel 70 x 45</text>

      <!-- Labels. -->
      <text class="label" x="184" y="212" text-anchor="middle">PERGOLA</text>
      <text class="small" x="184" y="225" text-anchor="middle">2,51 × 4,00 m · 10,03 m²</text>
      <text class="label" x="423" y="182" text-anchor="middle">LOUNGE / KANTOOR</text>
      <text class="small" x="423" y="195" text-anchor="middle">3,60 × 2,62 m · 9,43 m²</text>
      <text class="label" x="637.75" y="185" text-anchor="middle">BADKAMER</text>
      <text class="small" x="637.75" y="198" text-anchor="middle">1,70 × 2,62 m · 4,45 m²</text>
      <text class="small" x="604" y="158" text-anchor="middle">douche 80 × 100</text>
      <text class="small" x="684" y="283" text-anchor="middle">wastafel 80 × 45</text>
      <text class="small" x="671.75" y="139" text-anchor="middle">hangtoilet</text>
      <text class="label" x="766" y="190" text-anchor="middle">BERGING</text>
      <text class="small" x="766" y="203" text-anchor="middle">1,50 × 2,62 m · 3,93 m²</text>
      <text class="note" x="559" y="343" text-anchor="middle">OVERDEKT HOUTEN PAD · 0,90 m · OP BESTAANDE FUNDERING</text>

      <!-- Dimensions. -->
      <line class="dimension" x1="90" y1="425" x2="840" y2="425" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="dimension" x1="90" y1="400" x2="90" y2="438" />
      <line class="dimension" x1="840" y1="400" x2="840" y2="438" />
      <text class="measure" x="465" y="419" text-anchor="middle">10,00 m fundering + dak</text>

      <line class="dimension" x1="875" y1="75" x2="875" y2="307.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="dimension" x1="850" y1="75" x2="888" y2="75" />
      <line class="dimension" x1="850" y1="307.5" x2="888" y2="307.5" />
      <text class="measure" x="885" y="195" transform="rotate(90 885 195)" text-anchor="middle">3,10 m gebouw</text>

      <line class="dimension" x1="900" y1="307.5" x2="900" y2="375" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="dimension" x1="850" y1="375" x2="913" y2="375" />
      <text class="measure" x="910" y="341" transform="rotate(90 910 341)" text-anchor="middle">0,90 m pad</text>

      <line class="dimension" x1="925" y1="75" x2="925" y2="375" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <text class="measure" x="935" y="225" transform="rotate(90 935 225)" text-anchor="middle">4,00 m fundering + dak</text>
    </svg>

    <footer>
      <span>V2 · compacte tuinstudio op bestaande fundering</span>
      <span>Tek. 01-G2 · schaal 1:50 · augustus 2026</span>
    </footer>
  </main>
</body>
</html>
